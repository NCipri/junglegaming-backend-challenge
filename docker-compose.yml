name: wagering

x-app-env: &app-env
  DATABASE_URL: postgresql://app:app@postgres:5432/wagering
  DATABASE_MIGRATOR_URL: postgresql://migrator:migrator@postgres:5432/wagering
  SQS_ENDPOINT: http://ministack:4566
  SQS_REGION: us-east-1
  SQS_WAGER_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
  SQS_WAGER_DLQ_URL: http://ministack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wallet-events.fifo
  APP_ROLES: api,sqs-consumer,outbox-relay,pending-reference-worker
  AUTH_ISSUER: http://localhost:8081/realms/wagering
  AUTH_AUDIENCE: wagering-api
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  HTTP_PORT: '3000'
  METRICS_PORT: '9464'

x-app: &app
  image: wagering-processor:local
  stop_grace_period: 30s
  depends_on:
    migrator:
      condition: service_completed_successfully
    sqs-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD',
        'bun',
        '-e',
        "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)",
      ]
    interval: 5s
    timeout: 4s
    retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['55432:5432']
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ['postgres', '-c', 'max_connections=100']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.41
    ports: ['4566:4566']
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  migrator:
    image: wagering-processor:local
    build: .
    environment:
      DATABASE_MIGRATOR_URL: postgresql://migrator:migrator@postgres:5432/wagering
    command: ['bun', 'scripts/migrate.ts', 'up']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  sqs-init:
    image: wagering-processor:local
    environment:
      SQS_ENDPOINT: http://ministack:4566
      SQS_REGION: us-east-1
    command: ['bun', 'scripts/sqs-init.ts']
    depends_on:
      ministack:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: 'no'

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports: ['8081:8080']
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2

  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3

  nginx:
    image: nginx:1.30.5-alpine
    ports: ['8080:8080']
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy

volumes:
  pgdata:
