# Local stack: Postgres, MiniStack (SQS) and one-shot queue bootstrap.
# App instances, nginx and Keycloak are added in later stages.
name: wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['55432:5432'] # host 55432 avoids clashing with a local Postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ['postgres', '-c', 'max_connections=100']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.41
    ports: ['4566:4566']
    healthcheck:
      # The "Ready" log line precedes the HTTP listener; probe the health endpoint (spike).
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-init:
    # Needs `bun install` on the host first; switched to the app image in Etapa 16.
    image: oven/bun:1.4.4
    working_dir: /app
    volumes: ['.:/app:ro']
    environment:
      SQS_ENDPOINT: http://ministack:4566
      SQS_REGION: us-east-1
    command: ['bun', 'scripts/sqs-init.ts']
    depends_on:
      ministack:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata:
