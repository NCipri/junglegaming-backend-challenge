name: wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['55432:5432']
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ['postgres', '-c', 'max_connections=100']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.41
    ports: ['4566:4566']
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-init:
    image: oven/bun:1.4.4
    working_dir: /app
    volumes: ['.:/app:ro']
    environment:
      SQS_ENDPOINT: http://ministack:4566
      SQS_REGION: us-east-1
    command: ['bun', 'scripts/sqs-init.ts']
    depends_on:
      ministack:
        condition: service_healthy
    restart: 'no'

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports: ['8081:8080']
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
